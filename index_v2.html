<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คิวทีมแบดมินตัน</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#667085;--border:#d8dee8;--green:#16a34a;--green-bg:#dcfce7;--green-border:#86efac}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}main{max-width:780px;margin:auto;padding:20px 16px 32px}h1{font-size:28px;margin:0 0 5px}.sub{color:var(--muted);margin-bottom:20px}.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:16px}.title{font-size:20px;font-weight:800;margin-bottom:12px}.score{display:flex;flex-direction:column;gap:8px}.row{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 10px;border:2px solid var(--border);border-radius:15px;background:#fff}.row:nth-child(1),.row:nth-child(2){background:var(--green-bg);border-color:var(--green-border)}.rank{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:#eef2f6;display:flex;align-items:center;justify-content:center;font-weight:800}.row:nth-child(1) .rank,.row:nth-child(2) .rank{background:var(--green);color:#fff}.team-name{font-size:19px;font-weight:750;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button,input{font:inherit}.remove{min-width:56px;min-height:46px;border:1px solid var(--border);border-radius:11px;background:#fff;font-weight:650}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.team-btn{min-height:60px;border:2px solid var(--border);border-radius:15px;background:#fff;font-size:18px;font-weight:800}.input-row{display:flex;gap:10px}input{flex:1;min-width:0;height:54px;border:2px solid var(--border);border-radius:13px;padding:0 14px;font-size:18px}.add{height:54px;min-width:110px;border:0;border-radius:13px;background:var(--text);color:#fff;font-weight:800}.hint,.status{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}.status{color:var(--green);font-weight:700;min-height:20px}.actions{display:flex;gap:10px}.action{flex:1;min-height:50px;border:1px solid var(--border);border-radius:13px;background:#fff;font-weight:700}.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--border);border-radius:15px}@media(max-width:430px){.buttons{grid-template-columns:1fr}.input-row{flex-direction:column}.add{width:100%}}
</style></head><body><main><h1>🏸 คิวทีมแบดมินตัน</h1><div class="sub">สกอ 1–10 • กดปุ่มชื่อทีมเพื่อส่งทีมนั้นไปท้ายคิว</div><section class="panel"><div class="title">สกอ 1–10</div><div id="score" class="score"></div></section><section class="panel"><div class="title">ปุ่มเรียกทีม</div><div id="buttons" class="buttons"></div><div class="hint">กดปุ่มทีมไหน ทีมนั้นจะลงท้ายสุด และทีมด้านล่างจะเลื่อนขึ้น</div></section><section class="panel"><div class="title">เพิ่มทีม</div><div class="input-row"><input id="name" maxlength="30" placeholder="เช่น ทีม A" autocomplete="off"><button id="add" class="add">+ เพิ่ม</button></div><div id="status" class="status"></div></section><section class="actions"><button id="undo" class="action">↩ Undo</button><button id="clear" class="action">ล้างทั้งหมด</button></section></main><script>
(()=>{const K='badminton_queue_10_v2';let teams=[],history=[];const $=x=>document.getElementById(x),score=$('score'),buttons=$('buttons'),name=$('name'),add=$('add'),undo=$('undo'),clear=$('clear'),status=$('status');try{const s=JSON.parse(localStorage.getItem(K)||'null');if(Array.isArray(s))teams=s.slice(0,10)}catch(e){}function save(){try{localStorage.setItem(K,JSON.stringify(teams))}catch(e){}}function cp(){history.push([...teams]);if(history.length>50)history.shift()}function msg(t){status.textContent=t;setTimeout(()=>{if(status.textContent===t)status.textContent=''},1800)}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){if(!teams.length){score.innerHTML='<div class="empty">ยังไม่มีทีม<br>เพิ่มชื่อทีมด้านล่างได้เลย</div>';buttons.innerHTML='<div class="empty">ยังไม่มีปุ่มทีม</div>'}else{score.innerHTML=teams.map((t,i)=>`<div class="row"><span class="rank">${i+1}</span><span class="team-name">${esc(t)}</span><button class="remove" data-remove="${i}">ลบ</button></div>`).join('');buttons.innerHTML=teams.map((t,i)=>`<button class="team-btn" data-team="${i}">${esc(t)}</button>`).join('')}add.disabled=teams.length>=10;name.disabled=teams.length>=10;undo.disabled=!history.length}function addTeam(){const t=name.value.trim();if(!t)return msg('กรุณาใส่ชื่อทีม');if(teams.length>=10)return msg('เพิ่มได้สูงสุด 10 ทีม');if(teams.includes(t))return msg('มีชื่อทีมนี้อยู่แล้ว');cp();teams.push(t);save();name.value='';render();msg('เพิ่ม '+t+' แล้ว');name.focus()}function rotate(i){if(i<0||i>=teams.length)return;cp();const t=teams.splice(i,1)[0];teams.push(t);save();render();msg(t+' → ท้ายคิว')}function remove(i){if(i<0||i>=teams.length)return;cp();const t=teams.splice(i,1)[0];save();render();msg('ลบ '+t+' แล้ว')}function doUndo(){if(!history.length)return;teams=history.pop();save();render();msg('ย้อนกลับแล้ว')}function clearAll(){if(!teams.length)return;cp();teams=[];save();render();msg('ล้างคิวแล้ว')}add.addEventListener('click',addTeam);name.addEventListener('keydown',e=>{if(e.key==='Enter')addTeam()});buttons.addEventListener('click',e=>{const b=e.target.closest('[data-team]');if(b)rotate(+b.dataset.team)});score.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b)remove(+b.dataset.remove)});undo.addEventListener('click',doUndo);clear.addEventListener('click',clearAll);render()})();
</script></body></html>
